runtime: python311
entrypoint: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2

# This matches your requirement to split load across machines
automatic_scaling:
  min_instances: 1
  max_instances: 5
  target_cpu_utilization: 0.50

env_variables:
  GCP_PROJECT_ID: "acs-assignment-497901"
  GCS_BUCKET_NAME: "gcp-bucket-srh"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  
  # ⚠️ REPLACE THESE TWO WITH YOUR ACTUAL STRINGS (from your Kubernetes secrets)
  MONGO_URI: "your_mongodb_connection_string"
  SECRET_KEY: "backend_secrets"