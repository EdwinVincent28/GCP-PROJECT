runtime: python311
service: backend        
instance_class: F4_1G
entrypoint: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2

# Splits the load across multiple machines based on traffic spikes
automatic_scaling:
  min_instances: 1
  max_instances: 5
  target_cpu_utilization: 0.50

